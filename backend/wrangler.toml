name = "cadiotheka"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-15"
upload_source_maps = true

[[d1_databases]]
binding = "DB"
database_name = "cadiotheka"
database_id = "c4694439-e7f4-48e0-9e2a-a7e431a8fbce"
remote = true

[[kv_namespaces]]
binding = "AUTH"
id = "ba027b7e98784b0dae06ab649b1738e4"
preview_id = "ba027b7e98784b0dae06ab649b1738e4"
remote = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "843579668967"

  [ratelimits.simple]
  limit = 30
  period = 60

[[r2_buckets]]
binding = "PROJECT_ASSETS"
bucket_name = "cadiotheka-assets"
remote = true

[[queues.producers]]
binding = "GLB_CONVERSION"
queue = "cadiotheka-glb-conversion"
remote = true

[[queues.consumers]]
queue = "cadiotheka-glb-conversion"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
max_concurrency = 2
remote = true

[secrets]
required = [
    "SESSION_SECRET",
    "TURNSTILE_SECRET",
    "GITHUB_CLIENT_ID",
    "GITHUB_CLIENT_SECRET",
    "GOOGLE_CLIENT_ID",
    "GOOGLE_CLIENT_SECRET",
]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
WEBAUTHN_RP_NAME = "Cadiotheka"
WEBAUTHN_RP_ID = "cadiotheka.com"
