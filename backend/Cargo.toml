[package]
name = "backend"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9.0", features = ["d1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
hmac = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.29.2", features = ["v4", "serde", "js"] }
base64 = "0.23.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
url = "2.5.8"
hex = "0.4.3"
oauth2 = { version = "5.0.0", default-features = false }
wasm-bindgen = "0.2.130"
html-escape = "0.3.1"
serde_qs = "1.1.3"
cookie = "0.18.2"
shared = { path = "../shared" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
ed25519-dalek = "3.0.0"
serde_cbor_2 = "0.13.0"
ifc-lite-core = "28.2.0"
ifc-lite-export = "28.2.0"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["getrandom"]
