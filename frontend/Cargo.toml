[package]
name = "frontend"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
leptos = { version = "0.9.0-rc1", features = ["csr"] }
wasm-bindgen = "0.2.130"
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
time = { version = "0.3.55", features = [
    "serde",
    "wasm-bindgen",
    "macros",
    "formatting",
    "parsing",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
fuzzy-matcher = "0.3.7"
js-sys = "0.3.107"
pulldown-cmark = { version = "0.13.6", default-features = false, features = [
    "html",
] }
ammonia = "4.2.5"
timeago = { version = "0.6.1", default-features = false }
human_format = "1.2.1"
thousands = "0.2.0"
shared = { path = "../shared" }
web-sys = { version = "0.3.107", features = [
    "Storage",
    "MediaQueryList",
    "Document",
    "HtmlDocument",
    "Element",
    "DomRect",
    "HtmlElement",
    "HtmlDialogElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "Node",
    "NodeList",
    "console",
    "IntersectionObserver",
    "IntersectionObserverInit",
    "IntersectionObserverEntry",
    "File",
    "FileList",
    "Blob",
    "Url",
    "FormData",
    "Window",
    "Performance",
    "Navigator",
    "Clipboard",
    "WebGl2RenderingContext",
    "MouseEvent",
    "WheelEvent",
    "UiEvent",
    "CredentialsContainer",
    "PublicKeyCredential",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
] }
console_error_panic_hook = "0.1.7"
urlencoding = "2.1.3"
send_wrapper = "0.6.0"
three-d = { version = "0.19.0", default-features = false, features = [
    "serde",
    "image",
] }
three-d-asset = { version = "0.10.0", features = ["gltf", "png", "jpeg"] }
uuid = { version = "1.29.2", features = ["v4", "serde", "js"] }
base64 = "0.23.1"
cookie = "0.18.2"
wasm-bindgen-futures = "0.4.80"

[package.metadata.cargo-machete]
ignored = ["strum"]

[lints]
workspace = true
