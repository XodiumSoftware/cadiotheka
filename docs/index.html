<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cadiotheka API docs</title>
        <style>
            :root { color-scheme: light dark; }
            body {
                margin: 0;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                background: #fff;
                color: #1a1a1a;
            }
            main { max-width: 42rem; margin: 0 auto; padding: 5rem 1.5rem; }
            h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
            .lede { margin: 0 0 2.5rem; color: #5a5a5a; }
            ul { list-style: none; margin: 0; padding: 0; }
            li + li { margin-top: 0.75rem; }
            a {
                display: block;
                padding: 1rem 1.25rem;
                border: 1px solid #d8d8d8;
                border-radius: 0.375rem;
                text-decoration: none;
                color: inherit;
            }
            a:hover, a:focus-visible { border-color: #1a1a1a; }
            code { font-family: ui-monospace, monospace; font-size: 0.95rem; }
            .desc { display: block; margin-top: 0.25rem; font-size: 0.875rem; color: #5a5a5a; }
            @media (prefers-color-scheme: dark) {
                body { background: #141414; color: #e8e8e8; }
                .lede, .desc { color: #a0a0a0; }
                a { border-color: #333; }
                a:hover, a:focus-visible { border-color: #e8e8e8; }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Cadiotheka API docs</h1>
            <p class="lede">Rust documentation for the Cadiotheka workspace crates.</p>
            <ul>
                <li>
                    <a href="frontend/index.html">
                        <code>frontend</code>
                        <span class="desc">Leptos CSR web application</span>
                    </a>
                </li>
                <li>
                    <a href="backend/index.html">
                        <code>backend</code>
                        <span class="desc">Cloudflare Workers API and D1 access</span>
                    </a>
                </li>
                <li>
                    <a href="shared/index.html">
                        <code>shared</code>
                        <span class="desc">Routes, validation and tags shared by both</span>
                    </a>
                </li>
            </ul>
        </main>
    </body>
</html>
